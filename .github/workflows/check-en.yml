name: checks

# The English page is generated, so the only way it can be wrong is by being
# stale. CI verifies rather than generates: it never writes to the repository,
# it just refuses a commit where en/index.html does not match what
# tools/build-en.js would produce from the current index.html and i18n table.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The same entry point the pre-commit hook runs, so CI and a local commit
      # can never disagree about what "passing" means.
      - name: Checks
        run: node tools/check.js
